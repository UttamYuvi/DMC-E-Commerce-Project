<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<h2>Welcome to SHOPINFI!</h2>
<h4>User Home Page</h4>

<button onclick="loadProducts()">Load Products</button>

<pre id="output"></pre>

<script>
    function loadProducts() {
        let token = localStorage.getItem("token");

        if (!token) {
            document.getElementById("output").innerText = "No token found. Please login again.";
            return;
        }

        fetch("http://localhost:8080/products", {
            method: "GET",
            headers: {
                "Authorization": "Bearer " + token
            }
        })
        .then(res => res.json())
        .then(data => {
            document.getElementById("output").innerText = <h2>hello<h2/>
        })
        .catch(err => {
            document.getElementById("output").innerText = "Unauthorized / Token invalid";
            console.log(err);
        });
    }
</script>


</body>
</html>
